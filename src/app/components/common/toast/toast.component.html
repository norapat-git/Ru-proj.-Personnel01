<div class="toast-viewport" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div class="toast-card toast-{{ toast.type }}" role="alert">
      <!-- Icon indicator -->
      <div class="toast-icon-wrapper">
        @if (toast.type === 'success') {
          <span class="material-symbols-rounded toast-icon">check_circle</span>
        } @else if (toast.type === 'error') {
          <span class="material-symbols-rounded toast-icon">error</span>
        } @else if (toast.type === 'warning') {
          <span class="material-symbols-rounded toast-icon">warning</span>
        } @else {
          <span class="material-symbols-rounded toast-icon">info</span>
        }
      </div>

      <!-- Content text -->
      <div class="toast-content">
        @if (toast.title) {
          <h4 class="toast-title">{{ toast.title }}</h4>
        }
        <p class="toast-message">{{ toast.message }}</p>
      </div>

      <!-- Dismiss button -->
      <button type="button" class="toast-close-btn" (click)="dismiss(toast.id)" aria-label="Close notification">
        <span class="material-symbols-rounded">close</span>
      </button>

      <!-- Countdown progress bar -->
      @if (toast.durationMs > 0) {
        <div class="toast-progress-track">
          <div class="toast-progress-bar" [style.animationDuration]="toast.durationMs + 'ms'"></div>
        </div>
      }
    </div>
  }
</div>
