<div class="nationality-toggle-wrapper">
  <div class="nationality-toggle-container" [class.is-locked]="isLocked()">
    <!-- Buttons Track (Blurred when locked) -->
    <div class="toggle-buttons-track" [class.is-blurred]="isLocked()">
      <button 
        type="button" 
        class="toggle-btn" 
        [class.active]="nationality() === 'thai'"
        [disabled]="isLoading() || isLocked()"
        (click)="setNationality('thai')"
      >
        <span>🇹🇭 บุคลากรชาวไทย</span>
      </button>
      <button 
        type="button" 
        class="toggle-btn" 
        [class.active]="nationality() === 'inter'"
        [disabled]="isLoading() || isLocked()"
        (click)="setNationality('inter')"
      >
        <span>🌐 บุคลากรต่างชาติ</span>
      </button>
    </div>

    <!-- Center Lock Overlay (Dead center Flexbox alignment - No spatial slide) -->
    <div class="pill-lock-overlay" [class.is-visible]="isLocked()">
      <button 
        type="button" 
        class="pill-center-lock-btn" 
        (click)="unlock()" 
        [disabled]="isLoading() || !isLocked()"
        [attr.tabindex]="isLocked() ? 0 : -1"
        title="คลิกเพื่อปลดล็อคประเภทบุคลากร"
        aria-label="คลิกเพื่อปลดล็อคประเภทบุคลากร"
      >
        <span class="lock-icon material-symbols-rounded default-lock">lock</span>
        <span class="lock-icon material-symbols-rounded hover-lock">lock_open</span>
      </button>
    </div>
  </div>
</div>
