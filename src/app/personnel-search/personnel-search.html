<!-- Nationality Toggle — Apple Segmented Control (มีระบบล็อคอัตโนมัติขณะดูข้อมูล) -->
<div class="search-nationality-bar">
  <app-nationality-toggle
    [isLocked]="isLocked()"
    (onUnlock)="unlockSearch()"
  ></app-nationality-toggle>
</div>

<div class="search-bar-container">
  <!-- ส่วนกรอกเงื่อนไขการค้นหา (Custom Select + Input Fields) พร้อมอนิเมชั่นสลับสัญชาติ -->
  <div class="search-inputs-wrapper" [class.switch-thai]="nationality() === 'thai'" [class.switch-inter]="nationality() === 'inter'">
    <!-- Dropdown สไตล์ Apple เปลี่ยนเงื่อนไขตามสัญชาติที่เลือกอัตโนมัติ -->
    <div class="form-group-search dropdown-group">
      <label class="search-label">เงื่อนไขการตรวจสอบ</label>
      <app-custom-select
        [options]="filterOptions()"
        [ngModel]="filterType"
        (ngModelChange)="onFilterTypeChange($event)"
        [searchable]="false"
        [disabled]="isLoading()"
      ></app-custom-select>
    </div>

    <!-- ช่องกรอกคำค้นหา (กล่องเดียวสำหรับทุกเงื่อนไข) -->
    <div class="search-fields-group">
      <div class="form-group-search-flex">
        <label class="search-label">
          @if (filterType === 'idCard') {
            ระบุเลขบัตรประชาชน 13 หลัก
          } @else if (filterType === 'passport') {
            ระบุเลขพาสปอร์ต
          } @else if (filterType === 'ssoId') {
            ระบุเลขประกันสังคม
          } @else if (filterType === 'nameTh') {
            ระบุชื่อ หรือ นามสกุล (ภาษาไทย)
          } @else if (filterType === 'nameEn') {
            ระบุชื่อ หรือ นามสกุล (English Name)
          }
        </label>
        <div class="search-input-box-wrapper">
          <span class="material-symbols-rounded search-input-icon">search</span>
          <input
            type="text"
            [(ngModel)]="singleKeyword"
            [placeholder]="
              filterType === 'idCard' ? 'กรอกเลขบัตรประชาชน 13 หลัก...' :
              (filterType === 'passport' ? 'กรอกเลขพาสปอร์ต...' :
              (filterType === 'ssoId' ? 'กรอกเลขประกันสังคม 13 หลัก...' :
              (filterType === 'nameTh' ? 'พิมพ์ชื่อ หรือ นามสกุล เพื่อค้นหา...' :
              'Type full name or partial name in English to search...')))
            "
            class="search-input"
            (keyup.enter)="onSearchSubmit()"
            [disabled]="isLoading()"
          />
          <div class="search-trailing-actions">
            @if (singleKeyword) {
              <button
                type="button"
                class="search-clear-btn"
                (click)="singleKeyword = ''"
                title="ล้างคำค้นหา"
                aria-label="ล้างคำค้นหา"
              >
                <span class="material-symbols-rounded">close</span>
              </button>
            }
            <span class="search-shortcut-hint">↵ Enter</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- แถวปุ่มกดค้นหา และปุ่มแสดงทุกคน (Search Actions Row) -->
  <div class="search-actions-row">
    <button (click)="onSearchSubmit()" class="btn-primary btn-search" [disabled]="isLoading()">
      <span class="material-symbols-rounded">search</span>
      <span>ค้นหาข้อมูล</span>
    </button>
    <button (click)="loadAllPersonnel()" class="btn-secondary btn-show-all" [disabled]="isLoading()">
      <span class="material-symbols-rounded">group</span>
      <span>แสดงข้อมูลบุคลากรทุกคน</span>
    </button>
  </div>
</div>
