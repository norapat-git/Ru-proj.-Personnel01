<!-- Top Bar: 3-Column Grid for True Mathematical Center & Right Margin Alignment -->
<div class="search-top-bar">
  <div class="search-top-spacer" aria-hidden="true"></div>

  <div class="search-top-center">
    <app-nationality-toggle
      [isLocked]="isLocked()"
      (onUnlock)="unlockSearch()"
    ></app-nationality-toggle>
  </div>

  <div class="search-top-right">
    <!-- Compact Hanging Blue Tag Action Button (Hanging from behind card) -->
    <div class="hanging-tag-container">
      <!-- Hanging Cord / String SVG (Reaching all the way to the Top Border) -->
      <svg class="tag-string-svg" viewBox="0 0 44 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <filter id="cord-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0.8" dy="1.2" stdDeviation="1" flood-opacity="0.22"/>
          </filter>
          <linearGradient id="navy-cord" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="35%" stop-color="#1e3a8a"/>
            <stop offset="70%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#0f172a"/>
          </linearGradient>
          <linearGradient id="clip-silver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#64748b"/>
            <stop offset="30%" stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#cbd5e1"/>
            <stop offset="100%" stop-color="#475569"/>
          </linearGradient>
        </defs>

        <g filter="url(#cord-shadow)">
          <!-- Left strand of navy cord connecting flush to the top card border -->
          <path d="M 16 0 L 20.5 44" stroke="url(#navy-cord)" stroke-width="1.8" stroke-linecap="square"/>
          <!-- Right strand of navy cord connecting flush to the top card border -->
          <path d="M 28 0 L 23.5 44" stroke="url(#navy-cord)" stroke-width="1.8" stroke-linecap="square"/>
          <!-- Top Silver Ring Clamp Loop -->
          <ellipse cx="22" cy="44" rx="3.5" ry="2.8" fill="none" stroke="url(#clip-silver)" stroke-width="1.6"/>
        </g>
      </svg>

      <!-- Suspended Compact Blue Tag Button -->
      <button 
        type="button" 
        class="hanging-tag-btn" 
        id="tour-add-btn" 
        (click)="openAdd()" 
        [disabled]="isLoading()" 
        title="เพิ่มข้อมูลบุคลากรใหม่" 
        aria-label="เพิ่มข้อมูลบุคลากรใหม่"
      >
        <!-- Top Metallic Clamp Band -->
        <span class="tag-metal-clamp" aria-hidden="true"></span>

        <!-- Tag Content -->
        <span class="material-symbols-rounded tag-action-icon">person_add</span>
        <span class="tag-badge-text">เพิ่ม</span>
      </button>
    </div>
  </div>
</div>

<div class="search-bar-container">
  <!-- ส่วนกรอกเงื่อนไขการค้นหา (Custom Select + Input Fields) พร้อมอนิเมชั่นสลับสัญชาติ -->
  <div class="search-inputs-wrapper" [class.switch-thai]="nationality() === 'thai'" [class.switch-inter]="nationality() === 'inter'">
    <!-- Dropdown สไตล์ Apple เปลี่ยนเงื่อนไขตามสัญชาติที่เลือกอัตโนมัติ -->
    <div class="form-group-search dropdown-group">
      <label class="search-label">เงื่อนไขการตรวจสอบ</label>
      <app-custom-select
        [options]="filterOptions()"
        [ngModel]="filterType"
        (ngModelChange)="onFilterTypeChange($event)"
        [searchable]="false"
        [disabled]="isLoading()"
      ></app-custom-select>
    </div>

    <!-- ช่องกรอกคำค้นหา (กล่องเดียวสำหรับทุกเงื่อนไข) -->
    <div class="search-fields-group">
      <div class="form-group-search-flex">
        <label class="search-label">
          @if (filterType === 'idCard') {
            ระบุเลขบัตรประชาชน 13 หลัก
          } @else if (filterType === 'passport') {
            ระบุเลขพาสปอร์ต
          } @else if (filterType === 'ssoId') {
            ระบุเลขประกันสังคม
          } @else if (filterType === 'nameTh') {
            ระบุชื่อ หรือ นามสกุล (ภาษาไทย)
          } @else if (filterType === 'nameEn') {
            ระบุชื่อ หรือ นามสกุล (English Name)
          }
        </label>
        <div class="search-input-box-wrapper">
          <span class="material-symbols-rounded search-input-icon">search</span>
          <input
            type="text"
            [(ngModel)]="singleKeyword"
            [placeholder]="
              filterType === 'idCard' ? 'กรอกเลขบัตรประชาชน 13 หลัก...' :
              (filterType === 'passport' ? 'กรอกเลขพาสปอร์ต...' :
              (filterType === 'ssoId' ? 'กรอกเลขประกันสังคม 13 หลัก...' :
              (filterType === 'nameTh' ? 'พิมพ์ชื่อ หรือ นามสกุล เพื่อค้นหา...' :
              'Type full name or partial name in English to search...')))
            "
            class="search-input"
            (keyup.enter)="onSearchSubmit()"
            [disabled]="isLoading()"
          />
          <div class="search-trailing-actions">
            @if (singleKeyword) {
              <button
                type="button"
                class="search-clear-btn"
                (click)="singleKeyword = ''"
                title="ล้างคำค้นหา"
                aria-label="ล้างคำค้นหา"
              >
                <span class="material-symbols-rounded">close</span>
              </button>
            }
            <span class="search-shortcut-hint">↵ Enter</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- แถวปุ่มกดด้านล่าง: ปุ่มแสดงทุกคน (ซ้าย) & ปุ่มค้นหาข้อมูล (ขวา) -->
  <div class="search-actions-row">
    <div class="search-actions-left">
      <button (click)="loadAllPersonnel()" class="btn-secondary btn-show-all" [disabled]="isLoading()">
        <span class="material-symbols-rounded">group</span>
        <span>แสดงข้อมูลบุคลากรทุกคน</span>
      </button>
    </div>

    <div class="search-actions-right">
      <button (click)="onSearchSubmit()" class="btn-primary btn-search" [disabled]="isLoading()">
        <span class="material-symbols-rounded">search</span>
        <span>ค้นหาข้อมูล</span>
      </button>
    </div>
  </div>
</div>
